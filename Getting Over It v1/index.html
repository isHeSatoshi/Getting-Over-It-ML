<!DOCTYPE html>
<!-- Created with https://packager.turbowarp.org/ -->
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- We only include this to explicitly loosen the CSP of various packager environments. It does not provide any security. -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Getting Over It v1</title>
  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    :root,
    body.is-fullscreen {
      background-color: #000000;
    }

    [hidden] {
      display: none !important;
    }

    h1 {
      font-weight: normal;
    }

    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }

    #app,
    #loading,
    #error,
    #launch {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      background-color: #000000;
    }

    #launch {
      background-color: rgba(0, 0, 0, 0.7);
      cursor: pointer;
    }

    .green-flag {
      width: 80px;
      height: 80px;
      padding: 16px;
      border-radius: 100%;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid hsla(0, 100%, 100%, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #loading {}

    .progress-bar-outer {
      border: 1px solid currentColor;
      height: 10px;
      width: 200px;
      max-width: 200px;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0;
      background-color: currentColor;
    }

    .loading-text,
    noscript {
      font-weight: normal;
      font-size: 36px;
      margin: 0 0 16px;
    }

    .loading-image {
      margin: 0 0 16px;
    }

    #error-message,
    #error-stack {
      font-family: monospace;
      max-width: 600px;
      white-space: pre-wrap;
      user-select: text;
      -webkit-user-select: text;
    }

    #error-stack {
      text-align: left;
      max-height: 200px;
      overflow: auto;
    }

    .control-button {
      width: 2rem;
      height: 2rem;
      padding: 0.375rem;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
    }

    .control-button-highlight:hover {
      background: #ff4c4c26;
    }

    .control-button-highlight.active {
      background: #ff4c4c59;
    }

    .fullscreen-button {
      background: white;
    }

    .standalone-fullscreen-button {
      position: absolute;
      top: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 0 0 0 4px;
      padding: 4px;
      cursor: pointer;
    }

    .sc-canvas {
      cursor: auto;
    }

    .sc-monitor-root[data-opcode^="data_"] .sc-monitor-value-color {
      background-color: #ff8c1a;
    }

    .sc-monitor-row-value-outer {
      background-color: #fc662c;
    }

    .sc-monitor-row-value-editing .sc-monitor-row-value-outer {
      background-color: #e25b27;
    }
  </style>
  <meta name="theme-color" content="#000000">

</head>

<body>
  <div id="app"></div>

  <div id="launch" class="screen" hidden title="Click to start">
    <div class="green-flag">
      <svg viewBox="0 0 16.63 17.5" width="42" height="44">
        <defs>
          <style>
            .cls-1,
            .cls-2 {
              fill: #4cbf56;
              stroke: #45993d;
              stroke-linecap: round;
              stroke-linejoin: round;
            }

            .cls-2 {
              stroke-width: 1.5px;
            }
          </style>
        </defs>
        <path class="cls-1"
          d="M.75,2A6.44,6.44,0,0,1,8.44,2h0a6.44,6.44,0,0,0,7.69,0V12.4a6.44,6.44,0,0,1-7.69,0h0a6.44,6.44,0,0,0-7.69,0" />
        <line class="cls-2" x1="0.75" y1="16.75" x2="0.75" y2="0.75" />
      </svg>
    </div>
  </div>

  <div id="loading" class="screen">
    <noscript>Enable JavaScript</noscript>


    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="loading-inner"></div>
    </div>
  </div>

  <div id="error" class="screen" hidden>
    <h1>Error</h1>
    <details>
      <summary id="error-message"></summary>
      <p id="error-stack"></p>
    </details>
  </div>

  <script src="script.js"></script>
  <script>
    const appElement = document.getElementById('app');
    const launchScreen = document.getElementById('launch');
    const loadingScreen = document.getElementById('loading');
    const loadingInner = document.getElementById('loading-inner');
    const errorScreen = document.getElementById('error');
    const errorScreenMessage = document.getElementById('error-message');
    const errorScreenStack = document.getElementById('error-stack');

    const handleError = (error) => {
      console.error(error);
      if (!errorScreen.hidden) return;
      errorScreen.hidden = false;
      errorScreenMessage.textContent = '' + error;
      let debug = error && error.stack || 'no stack';
      debug += '\nUser agent: ' + navigator.userAgent;
      errorScreenStack.textContent = debug;
    };
    const setProgress = (progress) => {
      if (loadingInner) loadingInner.style.width = progress * 100 + '%';
    };
    const interpolate = (a, b, t) => a + t * (b - a);

    try {
      setProgress(0.1);

      const scaffolding = new Scaffolding.Scaffolding();
      scaffolding.width = 640;
      scaffolding.height = 480;
      scaffolding.resizeMode = "preserve-ratio";
      scaffolding.editableLists = false;
      scaffolding.usePackagedRuntime = false;
      scaffolding.setup();
      scaffolding.appendTo(appElement);

      const vm = scaffolding.vm;
      window.scaffolding = scaffolding;
      window.vm = scaffolding.vm;
      window.Scratch = {
        vm,
        renderer: vm.renderer,
        audioEngine: vm.runtime.audioEngine,
        bitmapAdapter: vm.runtime.v2BitmapAdapter,
        videoProvider: vm.runtime.ioDevices.video.provider
      };

      // --- Frame-Synchronized Telemetry and Command Bridge ---
      window.nextCommand = null;
      window.lastAppliedCommandId = -1;
      window.stateHistory = {}; // Bounded ring buffer: frame_id -> state
      window.frameCounter = 0;
      window.isResetting = true;
      window.DEMO_RECORDING = false;
      window.DEMO_BUFFER = [];

      // Live AI stream fetch poller (updates mouse target in user browser tab)
      setInterval(async function() {
        try {
          const r = await fetch('/live_action.json?t=' + Date.now());
          if (r.ok) {
            const data = await r.json();
            if (data && data.screen_x !== undefined) {
              window.nextCommand = data;
              window.isResetting = true;
              const mouse = vm.runtime.ioDevices.mouse;
              if (mouse) {
                const sx = data.screen_x;
                const sy = data.screen_y;
                const canvasX = (sx / 240.0 * 0.5 + 0.5) * 480.0;
                const canvasY = (0.5 - sy / 180.0 * 0.5) * 360.0;
                mouse.postData({
                  x: canvasX,
                  y: canvasY,
                  canvasWidth: 480,
                  canvasHeight: 360,
                  isDown: data.is_down !== false
                });
              }
            }
          }
        } catch(e) {}
      }, 20);

      window.getStageVar = function(name) {
        if (!window.vm || !window.vm.runtime) return 0;
        const stage = window.vm.runtime.targets.find(t => t.isStage);
        if (!stage) return 0;
        const v = Object.values(stage.variables).find(v => v.name === name);
        return v ? v.value : 0;
      };

      window.getSpriteVar = function(spriteName, name) {
        if (!window.vm || !window.vm.runtime) return 0;
        const sprite = window.vm.runtime.targets.find(t => !t.isClone && t.getName() === spriteName);
        if (!sprite) return 0;
        const v = Object.values(sprite.variables).find(v => v.name === name);
        return v ? v.value : 0;
      };

      window.resetGame = function() {
        if (!window.vm || !window.vm.runtime) return false;
        window.nextCommand = null;
        window.lastAppliedCommandId = -1;
        window.stateHistory = {};
        window.frameCounter = 0;
        window.isResetting = true;
        window.DEMO_BUFFER = [];

        window.vm.runtime.startHats('event_whenbroadcastreceived', {
          BROADCAST_OPTION: 'New Game'
        });
        console.log("Game reset triggered via broadcast 'New Game'");
        return true;
      };

      const originalStep = vm.runtime._step;
      vm.runtime._step = function() {
        if (!window.nextCommand && !window.isResetting) {
          return; // Pause the game loop
        }

        // 1. Apply command if available before step.
        //    The env now sends *screen* coordinates directly (Scratch X/Y in
        //    [-240,240] x [-180,180]) — no camera math needed, because
        //    sensing_mousex/mousey are camera-relative screen coords and the
        //    game's `tick` already eases HAMMER X/Y toward the pointer offset
        //    by the player position. Writing _scratchX/_scratchY directly is
        //    exactly what the real mousemove handler ends up doing.
        if (window.nextCommand) {
          const mouse = vm.runtime.ioDevices.mouse;
          if (mouse) {
            const sx = window.nextCommand.screen_x;
            const sy = window.nextCommand.screen_y;
            const canvasX = (sx / 240.0 * 0.5 + 0.5) * 480.0;
            const canvasY = (0.5 - sy / 180.0 * 0.5) * 360.0;
            mouse.postData({
              x: canvasX,
              y: canvasY,
              canvasWidth: 480,
              canvasHeight: 360,
              isDown: window.nextCommand.is_down !== false
            });
          }
          window.lastAppliedCommandId = window.nextCommand.command_id;
          window.nextCommand = null;
        }

        // 2. Execute original Scratch runtime step
        originalStep.apply(this, arguments);

        // 3. Post-step state capture
        window.frameCounter++;
        const frameId = window.getStageVar('FRAME') || window.frameCounter;
        
        const px = window.getStageVar('PLAYER X');
        const py = window.getStageVar('PLAYER Y');
        const pvx = window.getStageVar('PLAYER SX');
        const pvy = window.getStageVar('PLAYER SY');
        const hx = window.getStageVar('HAMMER X');
        const hy = window.getStageVar('HAMMER Y');
        
        const prevFrame = window.stateHistory[frameId - 1];
        let hvx = 0;
        let hvy = 0;
        if (prevFrame) {
          hvx = hx - prevFrame.hammer_world_x;
          hvy = hy - prevFrame.hammer_world_y;
        }

        const hammer = vm.runtime.targets.find(t => !t.isClone && t.getName() === 'Hammer');
        const hammerAngle = hammer ? hammer.direction : 0;
        let hammerAngVel = 0;
        if (prevFrame) {
          let diff = hammerAngle - prevFrame.hammer_angle;
          while (diff > 180) diff -= 360;
          while (diff < -180) diff += 360;
          hammerAngVel = diff;
        }

        const playerTouch = window.getSpriteVar('Player', 'touch');
        const headTouch = window.getSpriteVar('Head', 'touch');
        const limbsTouch = window.getSpriteVar('limbs', 'touch');
        const contactFlag = (playerTouch || headTouch || limbsTouch) ? 1 : 0;

        let cx = 0, cy = 0, nx = 0, ny = 0;
        if (playerTouch) {
          cx = window.getSpriteVar('Player', 'touch x');
          cy = window.getSpriteVar('Player', 'touch y');
          const dx = cx - px;
          const dy = cy - py;
          const len = Math.hypot(dx, dy);
          if (len > 0) { nx = -dx / len; ny = -dy / len; }
        } else if (headTouch) {
          cx = window.getSpriteVar('Head', 'touch x');
          cy = window.getSpriteVar('Head', 'touch y');
          const dx = cx - hx;
          const dy = cy - hy;
          const len = Math.hypot(dx, dy);
          if (len > 0) { nx = -dx / len; ny = -dy / len; }
        }

        const effort = window.getSpriteVar('Player', 'effort') || window.getSpriteVar('Head', 'effort') || 0;
        const hammerAir = window.getStageVar('HAMMER AIR');

        window.stateHistory[frameId] = {
          frame_id: frameId,
          game_time: vm.runtime.currentStepTime,
          command_id_applied: window.lastAppliedCommandId,
          player_world_x: px,
          player_world_y: py,
          player_vx: pvx,
          player_vy: pvy,
          hammer_world_x: hx,
          hammer_world_y: hy,
          hammer_vx: hvx,
          hammer_vy: hvy,
          camera_x: window.getStageVar('CAMERA X'),
          camera_y: window.getStageVar('CAMERA Y'),
          pointer_screen_x: vm.runtime.ioDevices.mouse ? vm.runtime.ioDevices.mouse._scratchX : 0,
          pointer_screen_y: vm.runtime.ioDevices.mouse ? vm.runtime.ioDevices.mouse._scratchY : 0,
          hammer_angle: hammerAngle,
          hammer_angular_velocity: hammerAngVel,
          contact_flag: contactFlag,
          contact_point: [cx, cy],
          contact_normal: [nx, ny],
          contact_age: contactFlag ? 0 : (prevFrame ? prevFrame.contact_age + 1 : 100),
          hammer_air: hammerAir,
          effort: effort
        };

        // Demo recording hook: if the env turned on recording, capture the
        // latest frame's state + the *real* screen mouse (from the actual
        // mousemove handler, not the injected command) so we can behavior-clone
        // human play. The env toggles window.DEMO_RECORDING.
        if (window.DEMO_RECORDING && window.DEMO_BUFFER) {
          window.DEMO_BUFFER.push({
            frame_id: frameId,
            screen_x: vm.runtime.ioDevices.mouse ? vm.runtime.ioDevices.mouse._scratchX : 0,
            screen_y: vm.runtime.ioDevices.mouse ? vm.runtime.ioDevices.mouse._scratchY : 0,
            is_down: vm.runtime.ioDevices.mouse ? vm.runtime.ioDevices.mouse._isDown : false,
            player_world_x: px,
            player_world_y: py,
            hammer_world_x: hx,
            hammer_world_y: hy
          });
          if (window.DEMO_BUFFER.length > 200000) window.DEMO_BUFFER.shift();
        }

        // Ring buffer check: keep last 300 frames
        const keys = Object.keys(window.stateHistory);
        if (keys.length > 300) {
          const oldest = Math.min(...keys.map(Number));
          delete window.stateHistory[oldest];
        }
      };

      scaffolding.setUsername("player####".replace(/#/g, () => Math.floor(Math.random() * 10)));
      scaffolding.setAccentColor("#ff4c4c");

      try {
        scaffolding.addCloudProvider(new Scaffolding.Cloud.WebSocketProvider(["wss://clouddata.turbowarp.org", "wss://clouddata.turbowarp.xyz"], "389464290"));
      } catch (error) {
        console.error(error);
      }

      vm.setTurboMode(false);
      if (vm.setInterpolation) vm.setInterpolation(true);
      if (vm.setFramerate) vm.setFramerate(60);
      if (vm.renderer.setUseHighQualityRender) vm.renderer.setUseHighQualityRender(false);
      if (vm.setRuntimeOptions) vm.setRuntimeOptions({
        fencing: false,
        miscLimits: false,
        maxClones: 300,
      });
      if (vm.setCompilerOptions) vm.setCompilerOptions({
        enabled: true,
        warpTimer: true
      });
      if (vm.renderer.setMaxTextureDimension) vm.renderer.setMaxTextureDimension(2048);

      // enforcePrivacy threat model only makes sense in the editor
      if (vm.runtime.setEnforcePrivacy) vm.runtime.setEnforcePrivacy(false);

      if (typeof ScaffoldingAddons !== 'undefined') {
        ScaffoldingAddons.run(scaffolding, { "gamepad": false, "pointerlock": false, "specialCloudBehaviors": false, "unsafeCloudBehaviors": false, "pause": false });
      }

      scaffolding.setExtensionSecurityManager({
        getSandboxMode: () => 'unsandboxed',
        canLoadExtensionFromProject: () => true
      });
      for (const extension of []) {
        vm.extensionManager.loadExtensionURL(extension);
      }

    } catch (e) {
      handleError(e);
    }
  </script>
  <script>
    try {
      let menuClickAttempts = 0;
      const maxAttempts = 150; // Monitor for 15 seconds (150 * 100ms)
      let newGameTriggered = false;

      // Hook into project load event
      vm.runtime.once('PROJECT_LOADED', () => {
        console.log("Project loaded, initializing auto-start");

        // Persistent menu blocker - hides ALL Splash clones
        const menuBlocker = setInterval(() => {
          if (!vm || !vm.runtime) return;

          menuClickAttempts++;
          const stage = vm.runtime.targets.find(t => t.isStage);

          // Hide ALL Splash sprites AND clones (forEach, not find)
          let splashFound = false;
          vm.runtime.targets.forEach(t => {
            if (t.sprite && t.sprite.name === 'Splash' && t.visible) {
              t.setVisible(false);
              splashFound = true;
            }
          });

          if (splashFound) {
            console.log("Splash sprites/clones hidden");

            // Trigger New Game ONCE
            if (!newGameTriggered) {
              vm.runtime.startHats('event_whenbroadcastreceived', {
                BROADCAST_OPTION: 'New Game'
              });
              console.log("New Game triggered");
              newGameTriggered = true;

              // Force-disable variables AFTER New Game script runs
              setTimeout(() => {
                if (stage) {
                  const sfx = Object.values(stage.variables).find(v => v.name === 'SFX');
                  if (sfx) { sfx.value = "false"; console.log("SFX disabled"); }
                  const commentary = Object.values(stage.variables).find(v => v.name === 'COMMENTARY');
                  if (commentary) { commentary.value = "false"; console.log("Commentary disabled"); }
                }
              }, 300);
            }
          }

          // Continuously enforce SFX and Commentary OFF
          if (newGameTriggered && stage) {
            const sfx = Object.values(stage.variables).find(v => v.name === 'SFX');
            if (sfx && sfx.value !== "false") { sfx.value = "false"; }
            const commentary = Object.values(stage.variables).find(v => v.name === 'COMMENTARY');
            if (commentary && commentary.value !== "false") { commentary.value = "false"; }
          }

          // Stop after 15 seconds
          if (menuClickAttempts >= maxAttempts) {
            clearInterval(menuBlocker);
            console.log("Menu blocker stopped after 15 seconds");
          }
        }, 100);
      });
    } catch (e) {
      handleError(e);
    }
  </script>

  <script>
    console.log("Synchronized frame-level bridge is ready.");
  </script>

  <script>
    const getProjectData = (function () {
      const storage = scaffolding.storage;
      storage.onprogress = (total, loaded) => {
        setProgress(interpolate(0.2, 0.98, loaded / total));
      };

      storage.addWebStore(
        [
          storage.AssetType.ImageVector,
          storage.AssetType.ImageBitmap,
          storage.AssetType.Sound,
          storage.AssetType.Font
        ].filter(i => i),
        (asset) => new URL('./assets/' + asset.assetId + '.' + asset.dataFormat, location).href
      );
      return () => new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.onload = () => {
          resolve(xhr.response);
        };
        xhr.onerror = () => {
          if (location.protocol === 'file:') {
            reject(new Error('Zip environment must be used on a website, not on a local file. To fix this error, use the "Plain HTML" environment instead.'));
          } else {
            reject(new Error('Request to load project data failed.'));
          }
        };
        xhr.onprogress = (e) => {
          if (e.lengthComputable) {
            setProgress(interpolate(0.1, 0.2, e.loaded / e.total));
          }
        };
        xhr.responseType = 'arraybuffer';
        xhr.open('GET', "./assets/project.json");
        xhr.send();
      });
    })();
  </script>
  <script>
    const run = async () => {
      const projectData = await getProjectData();
      await scaffolding.loadProject(projectData);
      setProgress(1);
      loadingScreen.hidden = true;
      if (true) {
        scaffolding.start();
      } else {
        launchScreen.hidden = false;
        launchScreen.addEventListener('click', () => {
          launchScreen.hidden = true;
          scaffolding.start();
        });
        launchScreen.focus();
      }
    };
    run().catch(handleError);
  </script>
</body>

</html>
